<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<style>
/* ===== RESET TOTAL ===== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* ===== COLORES BASE ===== */
:root {
    --bg-main: #0b1220;
    --card-bg: #0f172a;
    --input-bg: #020617;
    --primary: #2563eb;
    --text-main: #e5e7eb;
    --text-muted: #94a3b8;
}

/* ===== TRANSPARENCIA REAL PARA WEBVIEW ===== */
html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

/* ===== CONTENEDOR ===== */
.container {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-main);
    padding: 20px;
}

/* ===== CARD ===== */
.card {
    width: 100%;
    max-width: 360px;
    background: var(--card-bg);
    padding: 24px;
    border-radius: 16px;
    box-shadow: 0 12px 30px rgba(0,0,0,.6);
}

/* ===== LOGO ===== */
.logo {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
}

.logo img {
    width: 140px;
}

/* ===== INPUTS ===== */
input {
    width: 100%;
    margin-bottom: 14px;
    padding: 12px 14px;
    border-radius: 10px;
    border: none;
    outline: none;
    background: var(--input-bg);
    color: var(--text-main);
    font-size: 16px;
}

input::placeholder {
    color: var(--text-muted);
}

/* ===== BOTÓN ===== */
button {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: var(--primary);
    color: #fff;
    font-weight: 600;
    font-size: 16px;
}

button:active {
    opacity: .85;
}
</style>
</head>

<body>
<div class="container">
    <div class="card">

        <div class="logo">
            <img src="bitel_logo.png" alt="Bitel">
        </div>

        <input type="text" placeholder="Usuario" autocomplete="username">
        <input type="password" placeholder="Contraseña" autocomplete="current-password">

        <button>Ingresar</button>

    </div>
</div>
</body>
</html>
