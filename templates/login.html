<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Login WO Pendientes</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<style>
* {
    box-sizing: border-box;
}

html, body {
    width: 100%;
    margin: 0;
}

/* 🔥 CORRECCIÓN CLAVE */
body {
    min-height: 100vh;
    background: linear-gradient(
        180deg,
        #0F2A44 0%,
        #0F2A44 40%,
        #0F2A44 70%,
        #0F2A44 100%
    );
    font-family: Arial, Helvetica, sans-serif;
    color: #e5e7eb;

    display: flex;
    justify-content: center;
    align-items: flex-start; /* 🔥 EVITA ESTIRAMIENTO */
}

/* LOGIN */
.login-box {
    margin-top: 140px;
    background: #020617;
    padding: 30px 25px;
    width: 100%;
    max-width: 360px;
    border-radius: 12px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    text-align: center;
}

/* LOGO */
.login-box img {
    width: 120px;
    margin-bottom: 20px;
}


/* MARCA */
.login-brand {
    margin: 0 0 8px;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.8px;
    color: #f8fafc;
}


/* TÍTULO */
.login-box h2 {
    margin: 0 0 20px;
    font-size: 20px;
    font-weight: 600;
}

/* INPUTS */
input {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    background: #020617;
    color: #e5e7eb;
    border: 1px solid #334155;
    border-radius: 6px;
    font-size: 14px;
}

input:focus {
    outline: none;
    border-color: #2563eb;
}

.password-field {
    position: relative;
    margin-top: 12px;
}

.password-field input {
    margin-top: 0;
    padding-right: 46px;
}

.toggle-password {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 32px;
    height: 32px;
    border: none;
    background: transparent;
    color: #93c5fd;
    cursor: pointer;
    font-size: 16px;
    padding: 0;
    margin: 0;
}

.toggle-password:hover {
    color: #bfdbfe;
    background: transparent;
}


/* BOTÓN */
button {
    width: 100%;
    padding: 12px;
    margin-top: 20px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

/* ERROR */
.error {
    margin-top: 15px;
    color: #f87171;
    font-size: 14px;
}

.success {
    margin-top: 15px;
    color: #86efac;
    font-size: 14px;
}

.alt-link {
    display: inline-block;
    margin-top: 14px;
    color: #93c5fd;
    font-size: 13px;
    text-decoration: none;
}

.alt-link:hover {
    text-decoration: underline;
}

</style>
</head>

<body>

<form method="post" class="login-box">

    <img src="{{ url_for('static', filename='bitel.png') }}" alt="Bitel">

    <h1 class="login-brand">FBB CENTER</h1>
    <h2>Acceso WO Pendientes</h2>

    <input type="text" name="username" placeholder="Usuario" required>
    <div class="password-field">
    <input id="login_password" type="password" name="password" placeholder="Contraseña" required>
    <button type="button" class="toggle-password" onclick="togglePassword('login_password', this)" aria-label="Mostrar u ocultar contraseña">👁️</button>
</div>
    <button type="submit">Ingresar</button>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    {% if success %}
        <div class="success">{{ success }}</div>
    {% endif %}

    <a class="alt-link" href="{{ url_for('change_password') }}">Cambio de contraseña</a>



</form>

<script>
function togglePassword(inputId, trigger){
    const input = document.getElementById(inputId);
    if(!input){
        return;
    }

    const isHidden = input.type === "password";
    input.type = isHidden ? "text" : "password";
    trigger.textContent = isHidden ? "🙈" : "👁️";
}
</script>

</body>
</html>
