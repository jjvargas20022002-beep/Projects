<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Login WO Pendientes</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<style>
* {
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    background: #0b1220;
    font-family: Arial, Helvetica, sans-serif;
    color: #e5e7eb;
    display: flex;
    justify-content: center;
    align-items: flex-start;   /* ✅ añadido */
    min-height: 100vh;         /* ✅ añadido */
}

/* 🔥 LOGIN */
.login-box {
    margin-top: 12vh;          /* ✅ cambiado (antes 140px) */
    background: #0f172a;
    padding: 30px 25px;
    width: 100%;
    max-width: 360px;
    border-radius: 12px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    text-align: center;
}

/* LOGO */
.login-box img {
    width: 120px;
    margin-bottom: 20px;
}

/* TÍTULO */
.login-box h2 {
    margin: 0 0 20px;
    font-size: 20px;
    font-weight: 600;
}

/* INPUTS */
input {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    background: #020617;
    color: #e5e7eb;
    border: 1px solid #334155;
    border-radius: 6px;
    font-size: 14px;
}

input:focus {
    outline: none;
    border-color: #2563eb;
}

/* BOTÓN */
button {
    width: 100%;
    padding: 12px;
    margin-top: 20px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

/* ERROR */
.error {
    margin-top: 15px;
    color: #f87171;
    font-size: 14px;
}
</style>
</head>

<body>

<form method="post" class="login-box">

    <img src="{{ url_for('static', filename='bitel.png') }}" alt="Bitel">

    <h2>Acceso WO Pendientes</h2>

    <input type="text" name="username" placeholder="Usuario" required>
    <input type="password" name="password" placeholder="Contraseña" required>

    <button type="submit">Ingresar</button>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

</form>

</body>
</html>
