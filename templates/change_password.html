<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cambio de contraseña</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<style>
* { box-sizing: border-box; }

html, body {
  width: 100%;
  margin: 0;
}

body {
  min-height: 100vh;
  background: linear-gradient(180deg, #0F2A44 0%, #0F2A44 100%);
  font-family: Arial, Helvetica, sans-serif;
  color: #e5e7eb;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

.form-box {
  margin-top: 120px;
  background: #020617;
  padding: 30px 25px;
  width: 100%;
  max-width: 380px;
  border-radius: 12px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.6);
  text-align: center;
}

.form-box img {
  width: 120px;
  margin-bottom: 20px;
}

.form-box h2 {
  margin: 0 0 18px;
  font-size: 20px;
  font-weight: 600;
}

input {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  background: #020617;
  color: #e5e7eb;
  border: 1px solid #334155;
  border-radius: 6px;
  font-size: 14px;
}

input:focus {
  outline: none;
  border-color: #2563eb;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 18px;
  background: #2563eb;
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}

button:hover {
  background: #1d4ed8;
}

.error {
  margin-top: 14px;
  color: #f87171;
  font-size: 14px;
}

.alt-link {
  display: inline-block;
  margin-top: 14px;
  color: #93c5fd;
  font-size: 13px;
  text-decoration: none;
}

.alt-link:hover {
  text-decoration: underline;
}
</style>
</head>

<body>
<form method="post" class="form-box">
  <img src="{{ url_for('static', filename='bitel.png') }}" alt="Bitel">
  <h2>Cambio de contraseña</h2>

  <input type="text" name="username" placeholder="Usuario" required>
  <input type="password" name="old_password" placeholder="Contraseña antigua" required>
  <input type="password" name="new_password" placeholder="Nueva contraseña" required>
  <input type="password" name="repeat_new_password" placeholder="Repetir nueva contraseña" required>

  <button type="submit">Actualizar contraseña</button>

  {% if error %}
    <div class="error">{{ error }}</div>
  {% endif %}

  <a class="alt-link" href="{{ url_for('login') }}">Volver al inicio de sesión</a>
</form>
</body>
</html>
