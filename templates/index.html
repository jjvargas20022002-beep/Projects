<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>WO Pendientes FTTH</title>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body { background:#0f172a; color:#e5e7eb; font-family:Arial; padding:20px }
.filters { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:15px }
select, button { padding:6px; background:#020617; color:#e5e7eb; border:1px solid #334155 }
table { width:100%; border-collapse:collapse; font-size:13px }
th, td { border:1px solid #334155; padding:6px }
th { background:#1e293b }
tr:nth-child(even){ background:#020617 }
.map-cell { white-space:nowrap }
#map { height:400px; border-radius:8px; margin-bottom:15px }
</style>
</head>

<body>

<h1>WO Pendientes FTTH</h1>

<form method="get" class="filters">
<input type="hidden" name="prev_tab" value="{{ selected_tab }}">

<select name="tab" onchange="this.form.submit()">
  {% for t in tabs %}
  <option value="{{ t }}" {% if t==selected_tab %}selected{% endif %}>{{ t }}</option>
  {% endfor %}
</select>

{% if is_branch_tab %}
<select name="filter1" onchange="this.form.submit()">
  <option value="">BRANCH</option>
  {% for f in filters1 %}
  <option value="{{ f }}" {% if f==selected_filter1 %}selected{% endif %}>{{ f }}</option>
  {% endfor %}
</select>

<select name="filter2" onchange="this.form.submit()">
  <option value="">CONTRATA</option>
  {% for f in filters2 %}
  <option value="{{ f }}" {% if f==selected_filter2 %}selected{% endif %}>{{ f }}</option>
  {% endfor %}
</select>
{% else %}
<select name="filter1" onchange="this.form.submit()">
  <option value="">SITE</option>
  {% for f in filters1 %}
  <option value="{{ f }}" {% if f==selected_filter1 %}selected{% endif %}>{{ f }}</option>
  {% endfor %}
</select>

<select name="filter2" onchange="this.form.submit()">
  <option value="">REPORTE CONTRATA</option>
  {% for f in filters2 %}
  <option value="{{ f }}" {% if f==selected_filter2 %}selected{% endif %}>{{ f }}</option>
  {% endfor %}
</select>
{% endif %}

{% if has_coords %}
<button type="button" onclick="toggleMap()">🗺️</button>
{% endif %}
</form>

<div id="map-container" style="display:none">
  <div id="map"></div>
</div>

<p>Resultados: {{ rows|length }}</p>

<table>
<thead>
<tr>
{% for h in headers %}<th>{{ h }}</th>{% endfor %}
</tr>
</thead>
<tbody>
{% for r in rows %}
<tr>
{% for c in r %}<td>{{ c }}</td>{% endfor %}
</tr>
{% endfor %}
</tbody>
</table>

<script>
let map;

function toggleMap() {
  const cont = document.getElementById("map-container");
  cont.style.display = cont.style.display === "none" ? "block" : "none";
  if (cont.style.display === "block") initMap();
}

function initMap() {
  if (map) map.remove();
  map = L.map("map");

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

  const coords = {{ coords | tojson }};
  if (!coords.length) { map.setView([0,0],2); return; }

  const bounds = [];
  coords.forEach(c=>{
    L.marker([c.lat,c.lng]).addTo(map);
    bounds.push([c.lat,c.lng]);
  });
  map.fitBounds(bounds);
}
</script>

</body>
</html>
