<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Consulta Sheets</title>
    <style>
        body {
            background: #0f172a;
            color: #e5e7eb;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        select {
            padding: 6px;
            font-size: 14px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            border: 1px solid #334155;
            padding: 6px;
        }
        th {
            background: #1e293b;
        }
        tr:nth-child(even) {
            background: #020617;
        }
        a {
            color: #38bdf8;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<h1>Consulta de Servicios</h1>

<form method="get" class="filters">

    <div>
        <label>TAB</label><br>
        <select name="tab" onchange="this.form.submit()">
            {% for t in tabs %}
            <option value="{{ t }}" {% if t == selected_tab %}selected{% endif %}>
                {{ t }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div>
        <label>BRANCH</label><br>
        <select name="branch" onchange="this.form.submit()">
            <option value="">Todos</option>
            {% for b in branches %}
            <option value="{{ b }}" {% if b == selected_branch %}selected{% endif %}>
                {{ b }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div>
        <label>CONTRATA</label><br>
        <select name="contrata" onchange="this.form.submit()">
            <option value="">Todos</option>
            {% for c in contratas %}
            <option value="{{ c }}" {% if c == selected_contrata %}selected{% endif %}>
                {{ c }}
            </option>
            {% endfor %}
        </select>
    </div>

</form>

<p>Resultados: <strong>{{ rows|length }}</strong></p>

<table>
<thead>
<tr>
    {% for h in headers %}
    <th>{{ h }}</th>
    {% endfor %}
</tr>
</thead>

<tbody>
{% for row in rows %}
<tr>
    {% for cell in row %}
    <td>
