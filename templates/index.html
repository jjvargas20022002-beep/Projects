<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>WO Pendientes FTTH</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>

<style>
body { background:#0f172a; color:#e5e7eb; font-family:Arial; padding:20px }
.filters { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:15px }
select, button { padding:6px; background:#020617; color:#e5e7eb; border:1px solid #334155 }
table { width:100%; border-collapse:collapse; font-size:13px }
th, td { border:1px solid #334155; padding:6px }
th { background:#1e293b }
tr:nth-child(even){ background:#020617 }
#map { height:400px; border-radius:8px; margin-bottom:15px }
</style>
</head>

<body>

<h1>WO Pendientes FTTH</h1>

<p>
  Total registros: <b>{{ total_rows }}</b>
  {% if total_rows != filtered_count %}
    | Mostrando: <b>{{ filtered_count }}</b>
  {% endif %}
</p>

<form method="get" class="filters">
  <input type="hidden" name="last_tab" id="last_tab" value="{{ selected_tab }}">

  <select name="tab" id="tab_select">
    {% for t in tabs %}
      <option value="{{ t }}" {% if t == selected_tab %}selected{% endif %}>{{ t }}</option>
    {% endfor %}
  </select>

  {% if has_coords %}
    <button type="button" onclick="toggleMap()">🗺️ Mapa</button>
  {% endif %}
</form>

<div id="map-container" style="display:none">
  <div id="map"></div>
</div>

<script>
const selectedTab = "{{ selected_tab }}";

const ICONS = {
  green: new L.Icon({ iconUrl:"https://maps.google.com/mapfiles/ms/icons/green-dot.png", iconSize:[32,32]}),
  red: new L.Icon({ iconUrl:"https://maps.google.com/mapfiles/ms/icons/red-dot.png", iconSize:[32,32]}),
  yellow: new L.Icon({ iconUrl:"https://maps.google.com/mapfiles/ms/icons/yellow-dot.png", iconSize:[32,32]}),
  blue: new L.Icon({ iconUrl:"https://maps.google.com/mapfiles/ms/icons/blue-dot.png", iconSize:[32,32]})
};

let map;
let coberturaLayer;

function toggleMap() {
  const c = document.getElementById("map-container");
  c.style.display = c.style.display === "none" ? "block" : "none";
  if (c.style.display === "block") {
    initMap();
    setTimeout(() => map.invalidateSize(), 200);
  }
}

function initMap() {
  if (!map) {
    map = L.map("map");
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
  }

  if (!coberturaLayer) {
    coberturaLayer = omnivore.kml("/static/cobertura.kml").addTo(map);
  }

  const coordsInfo = {{ coords_info | tojson }};
  if (!coordsInfo.length) return;

  coordsInfo.forEach(p => {

    let popup = `<b>CAJA:</b> ${p.caja}<br><b>CLIENTES:</b> ${p.cuenta}`;

    if (selectedTab === "PENDIENTES ODN") {
      popup += `<br><b>Estado de la caja:</b> ${p.status || "—"}`;
    }

    if ([
      "LI1 TGI","LI2 ERAM","LI2 DIJUSA",
      "LI3 INTER","LI4 BROKERS","LI4 TGI","LI7 MARCOS"
    ].includes(selectedTab)) {
      popup += `<br><b>Estado de la caja:</b> ${p.estado || "—"}`;
      popup += `<br><b>Reporte de Contrata:</b> ${p.reporte || "—"}`;
    }

    L.marker([p.lat, p.lng], { icon: ICONS.blue })
      .addTo(map)
      .bindPopup(popup);
  });
}

document.getElementById("tab_select").addEventListener("change", e => {
  document.getElementById("last_tab").value = "";
  e.target.form.submit();
});
</script>

</body>
</html>
