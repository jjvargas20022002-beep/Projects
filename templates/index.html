<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Consulta Sheets</title>
    <style>
        body {
            background: #0f172a;
            color: #e5e7eb;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        h1 {
            margin-bottom: 10px;
        }
        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        select {
            padding: 6px;
            font-size: 14px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            border: 1px solid #334155;
            padding: 6px;
            text-align: left;
        }
        th {
            background: #1e293b;
        }
        tr:nth-child(even) {
            background: #020617;
        }
        .count {
            margin-bottom: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<h1>Consulta de Servicios</h1>

<form method="get" class="filters">
    <div>
        <label>TAB</label><br>
        <select name="tab" onchange="this.form.submit()">
            {% for t in tabs %}
                <option value="{{ t }}" {% if t == selected_tab %}selected{% endif %}>
                    {{ t }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div>
        <label>BRANCH</label><br>
        <select name="branch" onchange="this.form.submit()">
            {% for b in branches %}
                <option value="{{ b }}" {% if b == selected_branch %}selected{% endif %}>
                    {{ b }}
                </option>
            {% endfor %}
        </select>
    </div>
</form>

<div class="count">
    Resultados: <strong>{{ rows|length }}</strong>
</div>

<table>
    <thead>
        <tr>
            {% for h in headers %}
                <th>{{ h }}</th>
            {% endfor %}
        </tr>
    </thead>
    <tbody>
        {% for row in rows %}
            <tr>
                {% for cell in row %}
                    <td>{{ cell }}</td>
                {% endfor %}
            </tr>
        {% endfor %}
    </tbody>
</table>

</body>
</html>
